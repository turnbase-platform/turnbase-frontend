server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback for client-side routing (IMP-M6-02) — anything that isn't a real static
  # asset resolves to index.html rather than a static 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
