# Build and test checks for turnbase-frontend.
#
# IMP-M0-05 owns this file: build, lint, typecheck, unit tests, container build. IMP-M0-11
# adds the `scan` job, the image scan and the GHCR push below.
#
# master everywhere, never main (conventions.md §4). No buf job, no Java job: this repo has
# no proto and no JVM toolchain.
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan — dependencies (report)
        # platform-operations.md FR-CICD-010: every finding is reported; only a critical one
        # blocks the build (the next step).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — dependencies (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

  container:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: turnbase/frontend:ci

      - name: Trivy scan — image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/frontend:ci
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/frontend:ci
          severity: CRITICAL
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        # FR-CICD-006: tagged with the commit SHA, on every push to master.
        if: github.event_name == 'push'
        run: |
          docker tag turnbase/frontend:ci ghcr.io/turnbase-platform/frontend:${{ github.sha }}
          docker push ghcr.io/turnbase-platform/frontend:${{ github.sha }}
